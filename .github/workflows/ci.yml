name: CI

# Day-to-day pushes to `dev` don't run CI; promoting dev -> main (a PR into main) does.
# Run manually with e2e_base_url to test a deployed site, e.g. https://boatbossloans-dev.vercel.app
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e_base_url:
        description: "Run E2E against this deployed URL instead of a local build (optional)"
        required: false
        default: ""

jobs:
  test:
    name: Lint, type-check, unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://boatbossloans.com

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ inputs.e2e_base_url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
